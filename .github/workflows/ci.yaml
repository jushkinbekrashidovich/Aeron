name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,tracking,trees,api]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t aeron-api .
      - name: Import check
        run: docker run --rm aeron-api python -c "from aeron.api.app import create_app; create_app()"
      - name: Health check without data (must report degraded)
        run: |
          docker run -d --name aeron -p 8000:8000 aeron-api
          sleep 8
          curl --fail http://localhost:8000/health | grep degraded
          docker rm -f aeron
