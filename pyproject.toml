[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeron"
version = "0.0.0"
description = "Air pollution analysis and PM2.5 forecasting research for Tashkent, Uzbekistan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime dependencies are added when the code that needs them is written.
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
notebooks = ["matplotlib>=3.8", "ipykernel", "nbclient", "nbformat"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
