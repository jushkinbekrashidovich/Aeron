[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aeron"
version = "0.0.0"
description = "Air pollution analysis and PM2.5 forecasting research for Tashkent, Uzbekistan"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Runtime dependencies are added when the code that needs them is written.
dependencies = ["numpy>=2.0", "pandas>=2.2", "scikit-learn>=1.5"]

[project.optional-dependencies]
dev = ["ruff", "pytest"]
# Experiment tracking (local SQLite store under mlruns/).
tracking = ["mlflow-skinny>=3.0", "sqlalchemy>=2.0", "alembic>=1.13"]
notebooks = ["matplotlib>=3.8", "ipykernel", "nbclient", "nbformat", "statsmodels>=0.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# MLflow uses a SQLAlchemy loader option that SQLAlchemy 2.1 marks as deprecated.
filterwarnings = ["ignore:.*noload.*:DeprecationWarning"]

[tool.ruff]
line-length = 88
